name: poweradmin_devcontainer

# One php-fpm image per PHP version (see .env): the first service of each database family
# builds it, the others in that family reuse the tag.
x-app: &app
  networks:
    - internal
  environment:
    - PHP_IDE_CONFIG=serverName=localhost
    - PA_CONFIG_PATH=/etc/poweradmin/settings.php

# The nginx image renders /etc/nginx/templates/*.template with envsubst at startup, so one
# template serves every plain front; FPM_UPSTREAM picks the fpm container.
x-web: &web
  image: nginx:latest
  networks:
    - internal

x-app-volumes:
  - &vol-app ../.:/app
  - &vol-nginx-template ./conf/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
  - &vol-xdebug ./conf/xdebug.ini:/usr/local/etc/php/conf.d/zz-xdebug.ini
  - &vol-error-reporting ./conf/error_reporting.ini:/usr/local/etc/php/conf.d/error_reporting.ini

services:
  # =============================================================================
  # PHP-FPM Application Containers
  # =============================================================================

  # PHP-FPM for MySQL + SQL backend (used by nginx)
  app-mysql:
    <<: *app
    container_name: pwa-mysql-sql
    image: poweradmin-devcontainer-fpm:${PHP_VERSION_MYSQL}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VARIANT=${PHP_VERSION_MYSQL}-fpm-${DEBIAN_VERSION}
        - XDEBUG=${PHP_XDEBUG:-0}
    volumes:
      - *vol-app
      - *vol-xdebug
      - *vol-error-reporting
      # VS Code opens the workspace here; the E2E sweep recipe also serves worktrees from it
      - ../..:/workspaces:cached
      - ./conf/settings-mysql-sql.php:/etc/poweradmin/settings.php:ro
    depends_on:
      mysql:
        condition: service_healthy

  # PHP-FPM for SQLite + SQL backend (used by caddy)
  app-sqlite:
    <<: *app
    container_name: pwa-sqlite-sql
    image: poweradmin-devcontainer-fpm:${PHP_VERSION_SQLITE}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VARIANT=${PHP_VERSION_SQLITE}-fpm-${DEBIAN_VERSION}
        - XDEBUG=${PHP_XDEBUG:-0}
    volumes:
      - *vol-app
      - *vol-xdebug
      - *vol-error-reporting
      # Read-only: only the E2E sweep recipe serves worktrees through this instance
      - ../..:/workspaces:ro
      - sqlite_data:/data
      - ./conf/settings-sqlite-sql.php:/etc/poweradmin/settings.php:ro
    depends_on:
      sqlite:
        condition: service_healthy

  # PHP-FPM for MySQL + API backend (used by nginx)
  app-mysql-api:
    <<: *app
    container_name: pwa-mysql-api
    image: poweradmin-devcontainer-fpm:${PHP_VERSION_MYSQL}
    volumes:
      - *vol-app
      - *vol-xdebug
      - *vol-error-reporting
      - ./conf/settings-mysql-api.php:/etc/poweradmin/settings.php:ro
    depends_on:
      mysql:
        condition: service_healthy

  # PHP-FPM for PostgreSQL + API backend (used by nginx)
  app-pgsql-api:
    <<: *app
    container_name: pwa-pgsql-api
    image: poweradmin-devcontainer-fpm:${PHP_VERSION_PGSQL}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VARIANT=${PHP_VERSION_PGSQL}-fpm-${DEBIAN_VERSION}
        - XDEBUG=${PHP_XDEBUG:-0}
    volumes:
      - *vol-app
      - *vol-xdebug
      - *vol-error-reporting
      # Read-only: only the E2E sweep recipe serves worktrees through this instance
      - ../..:/workspaces:ro
      - ./conf/settings-pgsql-api.php:/etc/poweradmin/settings.php:ro
    depends_on:
      pgsql:
        condition: service_healthy

  # PHP-FPM for SQLite + API backend (used by nginx)
  app-sqlite-api:
    <<: *app
    container_name: pwa-sqlite-api
    image: poweradmin-devcontainer-fpm:${PHP_VERSION_SQLITE}
    volumes:
      - *vol-app
      - *vol-xdebug
      - *vol-error-reporting
      - sqlite_data:/data
      - ./conf/settings-sqlite-api.php:/etc/poweradmin/settings.php:ro
    depends_on:
      sqlite:
        condition: service_healthy

  # PHP-FPM for MySQL + SQL backend (subfolder deployment testing)
  app-mysql-subfolder:
    <<: *app
    container_name: pwa-mysql-subfolder
    image: poweradmin-devcontainer-fpm:${PHP_VERSION_MYSQL}
    volumes:
      - *vol-app
      - *vol-xdebug
      - *vol-error-reporting
      - ./conf/settings-mysql-subfolder.php:/etc/poweradmin/settings.php:ro
    depends_on:
      mysql:
        condition: service_healthy

  # PHP-FPM for MySQL + SQL backend, German only (used by nginx)
  app-mysql-de:
    <<: *app
    container_name: pwa-mysql-sql-de
    image: poweradmin-devcontainer-fpm:${PHP_VERSION_DE}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VARIANT=${PHP_VERSION_DE}-fpm-${DEBIAN_VERSION}
        - XDEBUG=${PHP_XDEBUG:-0}
    volumes:
      - *vol-app
      - *vol-xdebug
      - *vol-error-reporting
      - ./conf/settings-mysql-sql-de.php:/etc/poweradmin/settings.php:ro
    depends_on:
      mysql:
        condition: service_healthy

  # =============================================================================
  # Web Servers
  # =============================================================================

  # Nginx webserver (MySQL + SQL) - Port 8080
  webserver:
    <<: *web
    container_name: pwa-web-mysql-sql
    ports:
      - "8080:80"
    environment:
      - FPM_UPSTREAM=app-mysql:9000
    volumes:
      - *vol-nginx-template
      - ../.:/app
    depends_on:
      - app-mysql

  # Apache webserver (PostgreSQL + SQL) - Port 8081
  apache:
    build:
      context: .
      dockerfile: apache.Dockerfile
      args:
        - VARIANT=${PHP_VERSION_PGSQL}-apache-${DEBIAN_VERSION}
    container_name: pwa-pgsql-sql
    networks:
      - internal
    ports:
      - "8081:80"
    volumes:
      - ../.:/app
      - ./conf/settings-pgsql-sql.php:/etc/poweradmin/settings.php:ro
    environment:
      - PA_CONFIG_PATH=/etc/poweradmin/settings.php
    depends_on:
      pgsql:
        condition: service_healthy

  # Caddy webserver (SQLite + SQL) - Port 8082
  caddy:
    image: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    container_name: pwa-web-sqlite-sql
    networks:
      - internal
    ports:
      - "8082:80"
    volumes:
      - ./conf/Caddyfile:/etc/caddy/Caddyfile
      - ../.:/app
      - sqlite_data:/data
      - caddy_data:/data/caddy
      - caddy_config:/config/caddy
    depends_on:
      - app-sqlite

  # Nginx webserver (MySQL + API) - Port 8083
  web-mysql-api:
    <<: *web
    container_name: pwa-web-mysql-api
    ports:
      - "8083:80"
    environment:
      - FPM_UPSTREAM=app-mysql-api:9000
    volumes:
      - *vol-nginx-template
      - ../.:/app
    depends_on:
      - app-mysql-api

  # Nginx webserver (PostgreSQL + API) - Port 8084
  web-pgsql-api:
    <<: *web
    container_name: pwa-web-pgsql-api
    ports:
      - "8084:80"
    environment:
      - FPM_UPSTREAM=app-pgsql-api:9000
    volumes:
      - *vol-nginx-template
      - ../.:/app
    depends_on:
      - app-pgsql-api

  # Nginx webserver (SQLite + API) - Port 8085
  web-sqlite-api:
    <<: *web
    container_name: pwa-web-sqlite-api
    ports:
      - "8085:80"
    environment:
      - FPM_UPSTREAM=app-sqlite-api:9000
    volumes:
      - *vol-nginx-template
      - ../.:/app
      - sqlite_data:/data
    depends_on:
      - app-sqlite-api

  # Nginx webserver (MySQL + Subfolder) - Port 8086
  web-subfolder:
    <<: *web
    container_name: pwa-web-subfolder
    ports:
      - "8086:80"
    volumes:
      - ./conf/nginx-subfolder.conf:/etc/nginx/conf.d/default.conf
      - ../.:/app
    depends_on:
      - app-mysql-subfolder

  # Nginx webserver (MySQL + SQL, German only) - Port 8087
  web-mysql-de:
    <<: *web
    container_name: pwa-web-mysql-sql-de
    ports:
      - "8087:80"
    environment:
      - FPM_UPSTREAM=app-mysql-de:9000
    volumes:
      - *vol-nginx-template
      - ../.:/app
    depends_on:
      - app-mysql-de

  # =============================================================================
  # Database Servers
  # =============================================================================

  mysql:
    image: ${MYSQL_IMAGE}:${MYSQL_VERSION}
    container_name: mariadb
    networks:
      - internal
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_IMAGE: ${MYSQL_IMAGE}
    volumes:
      - mysql_data:/var/lib/mysql
      - ../sql/pdns/${PDNS_BRANCH}/schema.mysql.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./scripts/mysql-init-poweradmin.sh:/docker-entrypoint-initdb.d/02-poweradmin.sh
      - ./scripts/custom-healthcheck.sh:/custom-healthcheck.sh
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: [ "CMD", "/custom-healthcheck.sh" ]
      start_period: 1m
      start_interval: 10s
      interval: 30s
      timeout: 5s
      retries: 3

  pgsql:
    image: ${PGSQL_IMAGE}:${PGSQL_VERSION}
    container_name: postgres
    networks:
      - internal
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgsql_data:/var/lib/postgresql/data
      - ../sql/pdns/${PDNS_BRANCH}/schema.pgsql.sql:/docker-entrypoint-initdb.d/01-init.sql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      # The socket answers while the init scripts still run; TCP only once the real server is up
      test: [ "CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${DB_USER} -d ${DB_NAME}" ]
      start_period: 1m
      start_interval: 5s
      interval: 30s
      timeout: 5s
      retries: 3

  sqlite:
    image: keinos/sqlite3
    container_name: sqlite
    user: "0:0"
    networks:
      - internal
    volumes:
      - sqlite_data:/data
      - ../sql/pdns/${PDNS_BRANCH}/schema.sqlite3.sql:/schema.sqlite3.sql
      - ./scripts/create-sqlite-db.sh:/init-db.sh
    command: ["/bin/sh", "-c", "/init-db.sh && tail -f /dev/null"]
    stdin_open: true
    tty: true
    restart: unless-stopped
    healthcheck:
      # The image's own check only runs sqlite3 --version; this waits for the schema
      test: [ "CMD-SHELL", "sqlite3 /data/pdns.db 'SELECT 1 FROM domains LIMIT 1'" ]
      start_period: 30s
      start_interval: 2s
      interval: 30s
      timeout: 3s
      retries: 3

  # =============================================================================
  # PowerDNS Servers (one per database type - all with DNSSEC enabled)
  # =============================================================================

  pdns-mysql:
    image: powerdns/pdns-auth-${PDNS_BRANCH}:${PDNS_VERSION}
    container_name: pdns-mysql
    restart: unless-stopped
    networks:
      - internal
    volumes:
      - ./conf/pdns-mysql.conf:/etc/powerdns/pdns.conf
    ports:
      - "127.0.0.1:1053:53"
      - "127.0.0.1:1053:53/udp"
      - "127.0.0.1:8181:8081"
    depends_on:
      mysql:
        condition: service_healthy

  pdns-pgsql:
    image: powerdns/pdns-auth-${PDNS_BRANCH}:${PDNS_VERSION}
    container_name: pdns-pgsql
    restart: unless-stopped
    networks:
      - internal
    volumes:
      - ./conf/pdns-pgsql.conf:/etc/powerdns/pdns.conf
    ports:
      - "127.0.0.1:1054:53"
      - "127.0.0.1:1054:53/udp"
      - "127.0.0.1:8182:8081"
    depends_on:
      pgsql:
        condition: service_healthy

  pdns-sqlite:
    image: powerdns/pdns-auth-${PDNS_BRANCH}:${PDNS_VERSION}
    container_name: pdns-sqlite
    restart: unless-stopped
    networks:
      - internal
    volumes:
      - ./conf/pdns-sqlite.conf:/etc/powerdns/pdns.conf
      - sqlite_data:/data
    ports:
      - "127.0.0.1:1055:53"
      - "127.0.0.1:1055:53/udp"
      - "127.0.0.1:8183:8081"
    depends_on:
      sqlite:
        condition: service_healthy

  # Opt-in, since LMDB is the only backend that implements views and network
  # mappings: docker compose --profile lmdb up pdns-lmdb
  pdns-lmdb:
    image: powerdns/pdns-auth-${PDNS_BRANCH}:${PDNS_VERSION}
    container_name: pdns-lmdb
    profiles:
      - lmdb
    networks:
      - internal
    volumes:
      - ./conf/pdns-lmdb.conf:/etc/powerdns/pdns.conf
      # The pdns user owns /var/lib/powerdns in the image; a volume on /data
      # lands as root and the backend cannot create its database.
      - lmdb_data:/var/lib/powerdns
    ports:
      - "127.0.0.1:1056:53"
      - "127.0.0.1:1056:53/udp"
      - "127.0.0.1:8184:8081"

  # =============================================================================
  # Admin Tools
  # =============================================================================

  adminer:
    image: adminer
    container_name: adminer
    networks:
      - internal
    ports:
      - "127.0.0.1:8090:8080"
    volumes:
      - sqlite_data:/data
      - ./adminer/login-password-less.php:/var/www/html/plugins-enabled/login-password-less.php

  # =============================================================================
  # LDAP Server (for LDAP authentication testing)
  # =============================================================================

  ldap:
    image: osixia/openldap:1.5.0@sha256:18742e9c449c9c1afe129d3f2f3ee15fb34cc43e5f940a20f3399728f41d7c28
    container_name: ldap
    networks:
      - internal
    environment:
      - LDAP_ORGANISATION=poweradmin
      - LDAP_DOMAIN=poweradmin.org
      - "LDAP_BASE_DN=dc=poweradmin,dc=org"
      - LDAP_ADMIN_PASSWORD=poweradmin
    # Fixtures load on first start: ldif files are applied in name order.
    volumes:
      - ./ldap/bootstrap:/container/service/slapd/assets/config/bootstrap/ldif/custom:ro
    command: ["--copy-service"]
    ports:
      - "127.0.0.1:389:389"
      - "127.0.0.1:636:636"
    healthcheck:
      test: ["CMD-SHELL", "ldapsearch -x -H ldap://localhost -b dc=poweradmin,dc=org -D 'cn=admin,dc=poweradmin,dc=org' -w poweradmin"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  ldapadmin:
    image: phpldapadmin/phpldapadmin:2.3.11@sha256:e4855767ffb1513ed6cbfa126ce0913ef229e9badf3c205a010a2421a2b5e47c
    container_name: ldapadmin
    networks:
      - internal
    environment:
      - LDAP_HOST=ldap
      - LDAP_PORT=389
      - LDAP_USERNAME=cn=admin,dc=poweradmin,dc=org
      - LDAP_PASSWORD=poweradmin
      - LDAP_BASE_DN=dc=poweradmin,dc=org
    ports:
      - "127.0.0.1:8443:8080"

volumes:
  mysql_data: { }
  pgsql_data: { }
  sqlite_data: {}
  lmdb_data: {}
  caddy_data: {}
  caddy_config: {}

networks:
  internal:
    driver: bridge
