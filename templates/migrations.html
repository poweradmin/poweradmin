<nav aria-label="breadcrumb" data-testid="breadcrumb-nav">
    <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="index.php">{% trans %}Home{% endtrans %}</a></li>
        <li class="breadcrumb-item" aria-current="page">{% trans %}Migrations{% endtrans %}</li>
    </ol>
</nav>

<h5 class="mb-3" data-testid="migrations-heading">{% trans %}Migrations{% endtrans %}</h5>

<form method="post" action="index.php?page=migrations" data-testid="migrations-form">
    <input type="hidden" name="_token" value="{{ csrf_token }}">
    <button type="submit" class="btn btn-primary btn-sm mb-3" data-testid="migrations-run-button">{% trans %}Update{% endtrans %}</button>
</form>

{% if output %}
<pre data-testid="migrations-output">
    {{ output }}
</pre>
{% endif %}
