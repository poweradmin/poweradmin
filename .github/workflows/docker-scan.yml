name: Docker Image Scan

# Trivy runs here rather than in docker.yml so image publishing is not gated on
# a scan, and so CVEs disclosed after a build still surface without a rebuild.
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/poweradmin/poweradmin

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        tag: [latest, stable, dev, lts, 4.2.x, 4.3.x, 4.4.x]
    permissions:
      contents: read
      packages: read
      security-events: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ matrix.tag }}
          format: 'sarif'
          output: 'trivy-${{ matrix.tag }}.sarif'

      # A distinct category per tag, otherwise each upload overwrites the last.
      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: 'trivy-${{ matrix.tag }}.sarif'
          category: trivy-${{ matrix.tag }}
