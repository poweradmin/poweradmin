name: docker native build

# Shared build for branches that publish a single moving tag on native runners
# instead of QEMU. Callers own the triggers; this owns the build.
on:
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to build'
        type: string
        required: true
      tag:
        description: 'Image tag to publish (dev, 4.3.x, ...)'
        type: string
        required: true
      cache_prefix:
        description: 'Registry cache tag prefix, per branch'
        type: string
        required: true
      no_cache:
        description: 'Build without layer cache'
        type: boolean
        default: false
      nonroot_smoke:
        description: 'Run the non-root smoke test. 3.x already runs as 82:82 on port 80 and has no port-switching entrypoint.'
        type: boolean
        default: true
    secrets:
      DOCKER_PASSWORD:
        description: 'Docker Hub token for the manifest push. GITHUB_TOKEN is provided automatically.'
        required: true

env:
  GHCR_IMAGE: ghcr.io/poweradmin/poweradmin
  DOCKERHUB_IMAGE: poweradmin/poweradmin

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Lint Dockerfile with hadolint
        if: matrix.platform == 'linux/amd64'
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile

      - name: Prepare platform slug
        env:
          PLATFORM: ${{ matrix.platform }}
        run: echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Labels are baked into the image config, so they must be applied here in the
      # build jobs, not in merge. Revision comes from the checkout, not github.sha,
      # which on a workflow_run event points at the default branch instead.
      - name: Resolve build revision
        id: vars
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.GHCR_IMAGE }}
          flavor: latest=false
          tags: type=raw,value=${{ inputs.tag }}
          labels: |
            org.opencontainers.image.revision=${{ steps.vars.outputs.sha }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.GHCR_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=registry,ref=${{ env.GHCR_IMAGE }}:${{ inputs.cache_prefix }}-${{ env.PLATFORM_PAIR }}
          cache-to: type=registry,ref=${{ env.GHCR_IMAGE }}:${{ inputs.cache_prefix }}-${{ env.PLATFORM_PAIR }},mode=max,ignore-error=true
          no-cache: ${{ inputs.no_cache }}

      # The digest is pushed but untagged, so a failing smoke test here blocks the
      # merge job and no tag ever points at it. Each platform is tested natively.
      - name: Smoke test (root mode - port 80)
        env:
          REF: ${{ env.GHCR_IMAGE }}@${{ steps.build.outputs.digest }}
        run: |
          docker run -d --name smoke-root -p 80:80 \
            -e DB_TYPE=sqlite -e DB_NAME=/db/poweradmin.db \
            -e DNS_HOSTMASTER=test.example.com \
            -e DNS_NS1=ns1.example.com -e DNS_NS2=ns2.example.com "$REF"
          for i in $(seq 1 60); do
            if [ "$(docker inspect -f '{{.State.Status}}' smoke-root 2>/dev/null)" != "running" ]; then
              echo "Root mode: container exited unexpectedly"; docker logs smoke-root; exit 1
            fi
            if curl -sf http://localhost:80/ -o /dev/null 2>/dev/null; then
              echo "Root mode: responded on port 80 (after ${i}s)"; break
            fi
            if [ "$i" = "60" ]; then
              echo "Root mode: no response within 60s"; docker logs smoke-root; exit 1
            fi
            sleep 1
          done
          docker rm -f smoke-root

      - name: Smoke test (non-root mode - port 8080)
        if: inputs.nonroot_smoke
        env:
          REF: ${{ env.GHCR_IMAGE }}@${{ steps.build.outputs.digest }}
        run: |
          docker run -d --name smoke-nonroot --user 82:82 -p 8080:8080 \
            -e DB_TYPE=sqlite -e DB_NAME=/db/poweradmin.db \
            -e DNS_HOSTMASTER=test.example.com \
            -e DNS_NS1=ns1.example.com -e DNS_NS2=ns2.example.com "$REF"
          for i in $(seq 1 60); do
            if [ "$(docker inspect -f '{{.State.Status}}' smoke-nonroot 2>/dev/null)" != "running" ]; then
              echo "Non-root mode: container exited unexpectedly"; docker logs smoke-nonroot; exit 1
            fi
            if curl -sf http://localhost:8080/ -o /dev/null 2>/dev/null; then
              echo "Non-root mode: responded on port 8080 (after ${i}s)"; break
            fi
            if [ "$i" = "60" ]; then
              echo "Non-root mode: no response within 60s"; docker logs smoke-nonroot; exit 1
            fi
            sleep 1
          done
          docker rm -f smoke-nonroot

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ inputs.tag }}

    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: docker.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          refs=""
          for d in *; do
            refs="$refs ${GHCR_IMAGE}@sha256:$d"
          done
          echo "Merging:$refs"
          # shellcheck disable=SC2086
          docker buildx imagetools create \
            -t "${GHCR_IMAGE}:${TAG}" \
            -t "${DOCKERHUB_IMAGE}:${TAG}" \
            $refs

      - name: Inspect manifest
        id: inspect
        run: |
          docker buildx imagetools inspect "${GHCR_IMAGE}:${TAG}"
          digest=$(docker buildx imagetools inspect "${GHCR_IMAGE}:${TAG}" --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.GHCR_IMAGE }}:${{ inputs.tag }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ github.run_id }}
          path: sbom.spdx.json

      - name: Job Summary
        if: always()
        env:
          IMAGE_DIGEST: ${{ steps.inspect.outputs.digest }}
          RUN_ID: ${{ github.run_id }}
          BUILD_REF: ${{ inputs.ref }}
        run: |
          {
            echo "### Docker Build Summary (${TAG}) 🐳"
            echo ""
            echo "**Build Information:**"
            echo "- Ref built: ${BUILD_REF}"
            echo "- Tags: ${GHCR_IMAGE}:${TAG}, ${DOCKERHUB_IMAGE}:${TAG}"
            echo "- Platforms: linux/amd64 (native), linux/arm64 (native)"
            echo "- Digest: ${IMAGE_DIGEST}"
            echo ""
            echo "**Security & Compliance:**"
            echo "- ✅ SBOM generated (artifact: sbom-${RUN_ID})"
            echo "- ✅ Images pushed to GHCR and Docker Hub"
            echo ""
            echo "**Workflow:** ${GITHUB_WORKFLOW} (#${GITHUB_RUN_NUMBER})"
          } >> "$GITHUB_STEP_SUMMARY"
