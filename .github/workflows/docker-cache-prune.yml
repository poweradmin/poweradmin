name: docker cache prune

# The GHA cache index goes on referencing blobs long after the storage backend
# has collected them, and buildx treats the resulting 404 as a fatal build
# error rather than a cache miss. Entries never age out on their own either:
# last_accessed_at is bumped by every run that reads the index, so the usual
# 7-day eviction never fires and the set grows without bound.
on:
  schedule:
    - cron: '0 5 * * 0'
  workflow_dispatch:
    inputs:
      max_age_days:
        description: 'Prune once the oldest buildkit blob is older than this many days'
        type: string
        default: '60'
      dry_run:
        description: 'List what would be deleted without deleting it'
        type: boolean
        default: false

permissions:
  actions: write

# Two prunes deleting the same entries at once would report spurious failures.
concurrency:
  group: docker-cache-prune
  cancel-in-progress: false

jobs:
  prune:
    name: Prune aged buildkit caches
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.repository == 'poweradmin/poweradmin'

    steps:
    - name: Prune buildkit cache entries
      env:
        GH_TOKEN: ${{ github.token }}
        MAX_AGE_DAYS: ${{ inputs.max_age_days || '60' }}
        DRY_RUN: ${{ inputs.dry_run || false }}
      run: |
        set -euo pipefail

        gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/caches?per_page=100" \
          --jq '.actions_caches[] | [.id, .key, .created_at] | @tsv' > caches.tsv

        # last_accessed_at is bumped by every run that consults the cache, so a
        # year-old entry still reads as fresh. Only created_at shows real age.
        cutoff=$(date -u -d "${MAX_AGE_DAYS} days ago" +%s)

        stale=0
        echo "::group::Aged buildkit blobs"
        while IFS=$'\t' read -r id key created; do
          case "$key" in buildkit-blob-*) ;; *) continue ;; esac
          if [ "$(date -u -d "$created" +%s)" -lt "$cutoff" ]; then
            stale=$((stale + 1))
            echo "${key} (created ${created})"
          fi
        done < caches.tsv
        echo "::endgroup::"

        if [ "$stale" -eq 0 ]; then
          echo "No buildkit blob older than ${MAX_AGE_DAYS} days. Nothing to prune."
          exit 0
        fi

        # The index is dropped before the blobs it points at. A run that dies
        # partway then leaves orphaned blobs, which are harmless, rather than an
        # index referencing blobs that are gone - the exact breakage this job
        # exists to prevent.
        grep -E $'\t'"index-buildkit-" caches.tsv > indexes.tsv || true
        grep -E $'\t'"buildkit-blob-" caches.tsv > blobs.tsv || true
        index_total=$(wc -l < indexes.tsv | tr -d ' ')
        blob_total=$(wc -l < blobs.tsv | tr -d ' ')

        echo "${stale} aged blob(s) found."
        echo "Dropping ${index_total} index and ${blob_total} blob entries."
        echo "The next Docker build repopulates the cache and will be slow."

        if [ "$DRY_RUN" = "true" ]; then
          echo "::group::Would delete"
          cut -f2 indexes.tsv blobs.tsv
          echo "::endgroup::"
          exit 0
        fi

        delete_entry() {
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/caches/$1" --silent 2>/dev/null
        }

        index_failed=0
        while IFS=$'\t' read -r id key created; do
          if ! delete_entry "$id"; then
            index_failed=$((index_failed + 1))
            echo "::error::could not delete ${key} (id ${id})"
          fi
        done < indexes.tsv

        # Removing blobs while an index still references them is the failure
        # mode itself, so stop rather than leave the cache in that state.
        if [ "$index_failed" -ne 0 ]; then
          echo "::error::${index_failed} index entries survived; leaving all blobs in place."
          exit 1
        fi

        deleted=0
        failed=0
        while IFS=$'\t' read -r id key created; do
          if delete_entry "$id"; then
            deleted=$((deleted + 1))
          else
            failed=$((failed + 1))
            echo "::warning::could not delete ${key} (id ${id})"
          fi
        done < blobs.tsv

        # A blob left behind is orphaned, not dangling: nothing references it and
        # the next run retries it, so it is reported without failing the job.
        {
          echo "### Docker cache prune"
          echo ""
          echo "- Aged blobs (older than ${MAX_AGE_DAYS} days): ${stale}"
          echo "- Index entries deleted: ${index_total}"
          echo "- Blob entries deleted: ${deleted}"
          echo "- Blob entries left behind: ${failed}"
        } >> "$GITHUB_STEP_SUMMARY"
