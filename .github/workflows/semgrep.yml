name: Semgrep

on:
  push:
    branches: [ "master", "develop", "release/4.2.x", "release/4.3.x" ]
  pull_request:
    branches: [ "master", "develop", "release/4.2.x", "release/4.3.x" ]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  semgrep:
    name: Semgrep scan
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:latest@sha256:65dcd4408adda7c183a6b4550cb1e9b19f7f627a6fbb7e0559bd466bedc44d7b

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Semgrep
        run: |
          semgrep scan \
            --config=p/php \
            --config=p/security-audit \
            --config=p/owasp-top-ten \
            --config=p/secrets \
            --exclude-rule=generic.html-templates.security.unquoted-attribute-var.unquoted-attribute-var \
            --exclude-rule=generic.html-templates.security.var-in-href.var-in-href \
            --sarif \
            --output=semgrep.sarif \
            --error || true

      - name: Upload SARIF to GitHub code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: semgrep.sarif
          category: semgrep
