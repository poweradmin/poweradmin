name: Semgrep

# Weekly rather than per-push: the scan runs with `--error || true`, so it never
# fails on a finding and only ever reported that it had finished.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  semgrep:
    name: Semgrep scan
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Semgrep
        run: |
          semgrep scan \
            --config=p/php \
            --config=p/security-audit \
            --config=p/owasp-top-ten \
            --config=p/secrets \
            --exclude-rule=generic.html-templates.security.unquoted-attribute-var.unquoted-attribute-var \
            --exclude-rule=generic.html-templates.security.var-in-href.var-in-href \
            --sarif \
            --output=semgrep.sarif \
            --error || true

      - name: Upload SARIF to GitHub code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: semgrep.sarif
          category: semgrep
