name: Docker arm64 Trial

# Throwaway measurement: how long does release/3.x's Dockerfile take to build on a
# NATIVE arm64 runner instead of under QEMU? 3.x compiles PHP extensions from source
# (docker-php-ext-install) rather than using the prebuilt installer the 4.x branches use,
# so its native time is the last unknown before promoting the matrix to the other branches.
#
# Builds only - nothing is pushed and no cache is used, so the number is a true cold build.
# Delete this file once the number is recorded.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release/3.x

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      # No cache and no push: measure a genuine cold build of 3.x's Dockerfile.
      - name: Build (measurement only)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=cacheonly
          no-cache: true
