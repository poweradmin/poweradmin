name: taint analysis

# Scheduled events only fire from the default branch, so this one workflow
# checks out and scans every active branch.
on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  taint:
    name: Taint (${{ matrix.branch }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        branch:
          - develop
          - master
          - release/4.3.x
          - release/4.2.x
          - release/3.x

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ matrix.branch }}

    - name: Setup PHP
      uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
      with:
        php-version: '8.4'
        coverage: none

    - name: Get Composer cache directory
      id: composer-cache-dir
      run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

    - name: Cache Composer dependencies
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.composer-cache-dir.outputs.dir }}
        key: ${{ runner.os }}-taint-${{ matrix.branch }}-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-taint-${{ matrix.branch }}-

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress

    - name: Fix vendor binary permissions
      run: chmod +x vendor/bin/*

    # Called directly rather than through a composer script, since the script
    # name differs across branches.
    - name: Run taint analysis
      run: vendor/bin/psalm --taint-analysis --no-cache --no-progress
