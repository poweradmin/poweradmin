name: docker pr checks

# The publish workflows only run after a merge, so an entrypoint or Dockerfile regression
# used to reach the dev tag before anyone saw it. This builds the image for the pull
# request and puts it through the full smoke script without pushing anything.
on:
  pull_request:
    paths:
      - Dockerfile
      - docker-entrypoint.sh
      - .dockerignore
      - .hadolint.yaml
      - .github/scripts/docker-smoke.sh
      - .github/workflows/docker-pr.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint Dockerfile with hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # Reuse the target branch's native amd64 layer cache; the package is public, so no login.
      - name: Resolve build cache ref
        id: cache
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          slug=$(printf '%s' "$BASE_REF" | tr '/' '-' | tr -cd '[:alnum:]._-')
          echo "ref=ghcr.io/poweradmin/poweradmin:buildcache-${slug}-linux-amd64" >> "$GITHUB_OUTPUT"

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: poweradmin:pr
          cache-from: type=registry,ref=${{ steps.cache.outputs.ref }}

      - name: Smoke test
        run: ./.github/scripts/docker-smoke.sh poweradmin:pr full
