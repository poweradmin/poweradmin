name: Docker Image Publish (3.x)

# release/3.x has no docker.yml of its own, so this is its only builder. Its php.yml is
# named "Composer" there, but workflow_run matches the workflow file, not the display name.
# The 3.x image runs as 82:82 on port 80 with no port-switching entrypoint, so the non-root
# smoke test does not apply.
on:
  workflow_run:
    workflows: ["validations"]
    types:
      - completed
    branches:
      - release/3.x
  workflow_dispatch:
    inputs:
      no_cache:
        description: 'Build without layer cache to pull in updated base packages'
        type: boolean
        default: false
  schedule:
    - cron: '30 4 * * 1'

concurrency:
  group: docker-publish-3.x
  cancel-in-progress: true

jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    uses: ./.github/workflows/docker-native.yml
    secrets: inherit
    with:
      # Never fall back to github.ref: a dispatch from master must not publish master as :lts.
      ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'release/3.x' }}
      tag: lts
      cache_prefix: buildcache-release-3.x
      nonroot_smoke: false
      no_cache: ${{ github.event_name == 'schedule' || inputs.no_cache == true }}
