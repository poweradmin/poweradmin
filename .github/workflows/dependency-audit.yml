name: dependency audit

# Dependabot only raises security updates against the default branch, so the
# maintained branches are audited here instead.
on:
  schedule:
    - cron: '0 7 * * 6'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    name: Audit maintained branches
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Setup PHP
      uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
      with:
        php-version: '8.2'

    # --locked reads composer.lock directly, so no dependency code is installed
    # or executed here.
    - name: Audit each branch lock file
      id: audit
      run: |
        : > report.md
        failed=0
        for branch in master develop release/4.3.x release/4.2.x release/3.x; do
          echo "::group::${branch}"
          work="$(mktemp -d)"
          git show "origin/${branch}:composer.json" > "$work/composer.json"
          git show "origin/${branch}:composer.lock" > "$work/composer.lock"
          if out="$(composer audit --locked --no-interaction --working-dir="$work" 2>&1)"; then
            echo "${branch}: clean"
          else
            failed=1
            {
              echo "### ${branch}"
              echo '```'
              echo "$out"
              echo '```'
              echo
            } >> report.md
          fi
          echo "$out"
          echo "::endgroup::"
        done
        echo "failed=${failed}" >> "$GITHUB_OUTPUT"

    - name: Open or update the tracking issue
      if: steps.audit.outputs.failed == '1'
      env:
        GH_TOKEN: ${{ github.token }}
        TITLE: "Dependency audit: vulnerable packages on maintained branches"
      run: |
        existing="$(gh issue list --state open --limit 200 --json number,title | python3 -c '
        import json, os, sys
        title = os.environ["TITLE"]
        print(next((str(i["number"]) for i in json.load(sys.stdin) if i["title"] == title), ""))')"
        if [ -n "$existing" ]; then
          gh issue comment "$existing" --body-file report.md
        else
          gh issue create --title "$TITLE" --body-file report.md
        fi

    - name: Fail if any branch has advisories
      if: steps.audit.outputs.failed == '1'
      run: exit 1
