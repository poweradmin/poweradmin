name: Create Draft Release

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - release/3.x
      - release/4.0.x
      - release/4.1.x
      - release/4.2.x
      - release/4.3.x
      - release/4.4.x

permissions:
  contents: write

concurrency:
  # One run per branch at a time. Pushes landing seconds apart could otherwise both
  # pass the existence check before either had created the draft.
  group: create-draft-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  create-draft-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Get current version
        id: current_version
        run: |
          VERSION=$(grep -oP "VERSION = '\K[^']+" lib/Version.php)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Current version: $VERSION"

      - name: Check if release already exists
        id: check_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: v${{ steps.current_version.outputs.version }}
        run: |
          # A lookup that fails has to stop the run, not fall through to "create".
          # Reading an API error as "no release exists" forked a second v4.4.1 draft
          # on 2026-08-17, which then drifted from the real one unnoticed.
          # shellcheck disable=SC2016  # $m and \(...) are jq syntax, not shell
          if ! COUNTS=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq '[.[] | select(.tag_name == env.RELEASE_TAG)] as $m
                    | "\($m | map(select(.draft)) | length) \($m | map(select(.draft | not)) | length)"'); then
            echo "::error::Could not list releases; refusing to guess whether $RELEASE_TAG exists"
            exit 1
          fi

          DRAFT_COUNT="${COUNTS%% *}"
          PUBLISHED_COUNT="${COUNTS##* }"
          echo "$RELEASE_TAG: $DRAFT_COUNT draft, $PUBLISHED_COUNT published"

          if [ "$PUBLISHED_COUNT" -gt 0 ]; then
            echo "Release $RELEASE_TAG already published, skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ "$DRAFT_COUNT" -gt 1 ]; then
            echo "::error::$DRAFT_COUNT drafts already exist for $RELEASE_TAG; delete the extras before rerunning"
            exit 1
          elif [ "$DRAFT_COUNT" -eq 1 ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "is_draft=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "is_draft=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check for releasable changes
        if: steps.check_release.outputs.skip != 'true'
        id: check_changes
        run: |
          # Get commits since last tag
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            COMMIT_COUNT=$(git rev-list --count HEAD)
          else
            COMMIT_COUNT=$(git rev-list --count "${LAST_TAG}..HEAD")
          fi

          # Check if there are releasable commits (feat or fix)
          if [ "$COMMIT_COUNT" -gt 0 ] && git log ${LAST_TAG:+$LAST_TAG..}HEAD --oneline | grep -qE "^[a-f0-9]+ (feat|fix)(\(|:)"; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No releasable changes found"
          fi

      - name: Get last tag
        id: last_tag
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          echo "tag=$LAST_TAG" >> "$GITHUB_OUTPUT"
          echo "Last tag: $LAST_TAG"

      - name: Generate release notes with git-cliff
        if: steps.check_release.outputs.skip != 'true' && steps.check_changes.outputs.has_changes == 'true'
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4
        id: cliff
        with:
          config: cliff.toml
          args: ${{ steps.last_tag.outputs.tag }}..HEAD --strip header
        env:
          OUTPUT: RELEASE_NOTES.md
        continue-on-error: true

      - name: Check release notes generated
        if: steps.check_release.outputs.skip != 'true' && steps.check_changes.outputs.has_changes == 'true'
        id: check_notes
        run: |
          if [ ! -f RELEASE_NOTES.md ] || ! grep -qE '\S' RELEASE_NOTES.md; then
            echo "No user-facing release notes after cliff filtering, skipping draft"
            echo "has_notes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_notes=true" >> "$GITHUB_OUTPUT"
            cat RELEASE_NOTES.md
          fi

      - name: Build final release notes
        if: steps.check_release.outputs.skip != 'true' && steps.check_changes.outputs.has_changes == 'true' && steps.check_notes.outputs.has_notes == 'true'
        run: |
          VERSION="${{ steps.current_version.outputs.version }}"

          # Check for SQL update files matching the target version
          HAS_MIGRATIONS=false
          for db in mysql pgsql sqlite; do
            if [ -f "sql/poweradmin-${db}-update-to-${VERSION}.sql" ]; then
              HAS_MIGRATIONS=true
              break
            fi
          done

          # Append migrations section if there are SQL updates
          if [ "$HAS_MIGRATIONS" == "true" ]; then
            echo "" >> RELEASE_NOTES.md
            echo "### Database Migrations" >> RELEASE_NOTES.md
            echo "" >> RELEASE_NOTES.md
            echo "The following database update scripts are included in this release:" >> RELEASE_NOTES.md
            echo "" >> RELEASE_NOTES.md

            for db in mysql pgsql sqlite; do
              FILE="sql/poweradmin-${db}-update-to-${VERSION}.sql"
              if [ -f "$FILE" ]; then
                echo "* \`${FILE}\`" >> RELEASE_NOTES.md
              fi
            done

            echo "" >> RELEASE_NOTES.md
            echo "> **Note:** Run the appropriate update script for your database type before upgrading." >> RELEASE_NOTES.md
          fi

      - name: Create or update draft release
        if: steps.check_release.outputs.skip != 'true' && steps.check_changes.outputs.has_changes == 'true' && steps.check_notes.outputs.has_notes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.current_version.outputs.version }}
          IS_DRAFT: ${{ steps.check_release.outputs.is_draft }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          RELEASE_TAG="v$VERSION"

          if [ "$IS_DRAFT" = "true" ]; then
            echo "Updating existing draft release $RELEASE_TAG"
            gh release edit "$RELEASE_TAG" \
              --title "$RELEASE_TAG" \
              --notes-file RELEASE_NOTES.md \
              --target "$REF_NAME"
          else
            echo "Creating new draft release $RELEASE_TAG"
            gh release create "$RELEASE_TAG" \
              --title "$RELEASE_TAG" \
              --notes-file RELEASE_NOTES.md \
              --target "$REF_NAME" \
              --draft
          fi
