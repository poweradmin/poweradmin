name: Docker Image Publish

on:
  workflow_run:
    workflows: ["validations"]
    types:
      - completed
    branches:
      - master
      - develop
      - release/3.x
      - release/4.2.x
      - release/4.3.x
  push:
    tags:
      - 'v*'
    branches:
      # release/4.2.x is absent: branch pushes build via docker-4.2.x.yml on master.
      # v* tags still publish here.
      - release/3.x
      - release/4.3.x
  workflow_dispatch:
    inputs:
      no_cache:
        description: 'Build without layer cache to pull in updated base packages'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: true

env:
  GHCR_IMAGE_NAME: poweradmin
  DOCKERHUB_IMAGE_NAME: poweradmin/poweradmin

jobs:
  build-push:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: write
      packages: write
      actions: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}

      - name: Lint Dockerfile with hadolint
        uses: hadolint/hadolint-action@2a66e89f53d0771bb131a7fa31f3136336094aa6 # v3.4.0
        with:
          dockerfile: Dockerfile

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: docker.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # metadata-action derives revision from github.sha, which on a workflow_run
      # event is the default branch rather than the sha actually checked out.
      - name: Resolve build revision
        id: vars
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/${{ env.GHCR_IMAGE_NAME }}
            ${{ env.DOCKERHUB_IMAGE_NAME }}
          flavor: |
            latest=false
          labels: |
            org.opencontainers.image.revision=${{ steps.vars.outputs.sha }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ (github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'master') || (github.event_name != 'workflow_run' && github.ref == 'refs/heads/master') }}
            type=raw,value=dev,enable=${{ (github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'develop') || (github.event_name != 'workflow_run' && github.ref == 'refs/heads/develop') }}
            type=raw,value=lts,enable=${{ (github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'release/3.x') || (github.event_name != 'workflow_run' && github.ref == 'refs/heads/release/3.x') }}
            type=raw,value=4.2.x,enable=${{ (github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'release/4.2.x') || (github.event_name != 'workflow_run' && github.ref == 'refs/heads/release/4.2.x') }}
            type=raw,value=4.3.x,enable=${{ (github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'release/4.3.x') || (github.event_name != 'workflow_run' && github.ref == 'refs/heads/release/4.3.x') }}

      - name: Resolve build cache ref
        id: cache
        env:
          BUILD_REF: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          slug=$(printf '%s' "$BUILD_REF" | tr '/' '-' | tr -cd '[:alnum:]._-')
          owner=$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')
          echo "ref=ghcr.io/${owner}/${GHCR_IMAGE_NAME}:buildcache-${slug}" >> "$GITHUB_OUTPUT"

      - name: Build local image for smoke test
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          tags: poweradmin:smoke-test
          cache-from: |
            type=registry,ref=${{ steps.cache.outputs.ref }}
            type=gha
          no-cache: ${{ inputs.no_cache == true }}

      - name: Smoke test (root mode - port 80)
        run: |
          docker run -d --name smoke-root \
            -p 80:80 \
            -e DB_TYPE=sqlite \
            -e DB_NAME=/db/poweradmin.db \
            -e DNS_HOSTMASTER=test.example.com \
            -e DNS_NS1=ns1.example.com \
            -e DNS_NS2=ns2.example.com \
            poweradmin:smoke-test

          for i in $(seq 1 60); do
            if [ "$(docker inspect -f '{{.State.Status}}' smoke-root 2>/dev/null)" != "running" ]; then
              echo "Root mode: container exited unexpectedly"
              docker logs smoke-root
              exit 1
            fi
            if curl -sf http://localhost:80/ -o /dev/null 2>/dev/null; then
              echo "Root mode: container responded on port 80 (after ${i}s)"
              break
            fi
            if [ "$i" = "60" ]; then
              echo "Root mode: container failed to respond within 60s"
              docker logs smoke-root
              exit 1
            fi
            sleep 1
          done

          docker rm -f smoke-root

      - name: Smoke test (non-root mode - port 8080)
        run: |
          docker run -d --name smoke-nonroot \
            --user 82:82 \
            -p 8080:8080 \
            -e DB_TYPE=sqlite \
            -e DB_NAME=/db/poweradmin.db \
            -e DNS_HOSTMASTER=test.example.com \
            -e DNS_NS1=ns1.example.com \
            -e DNS_NS2=ns2.example.com \
            poweradmin:smoke-test

          for i in $(seq 1 60); do
            if [ "$(docker inspect -f '{{.State.Status}}' smoke-nonroot 2>/dev/null)" != "running" ]; then
              echo "Non-root mode: container exited unexpectedly"
              docker logs smoke-nonroot
              exit 1
            fi
            if curl -sf http://localhost:8080/ -o /dev/null 2>/dev/null; then
              echo "Non-root mode: container responded on port 8080 (after ${i}s)"
              break
            fi
            if [ "$i" = "60" ]; then
              echo "Non-root mode: container failed to respond within 60s"
              docker logs smoke-nonroot
              exit 1
            fi
            sleep 1
          done

          docker rm -f smoke-nonroot

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=registry,ref=${{ steps.cache.outputs.ref }}
            type=gha
          cache-to: type=registry,ref=${{ steps.cache.outputs.ref }},mode=max,ignore-error=true
          no-cache: ${{ inputs.no_cache == true }}

      - name: Generate SBOM
        if: github.event_name != 'pull_request' && success()
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM as artifact
        if: github.event_name != 'pull_request' && success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ github.run_id }}
          path: sbom.spdx.json

      - name: Job Summary
        if: always()
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          echo "### Docker Build Summary 🐳" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Build Information:**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tags: $IMAGE_TAGS" >> "$GITHUB_STEP_SUMMARY"
          echo "- Platforms: linux/amd64, linux/arm64" >> "$GITHUB_STEP_SUMMARY"
          echo "- Digest: $IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Security & Compliance:**" >> "$GITHUB_STEP_SUMMARY"
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "- ✅ SBOM generated (artifact: sbom-$RUN_ID)" >> "$GITHUB_STEP_SUMMARY"
            echo "- ✅ Images pushed to GHCR and Docker Hub" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- 🔍 Build-only mode (PR)" >> "$GITHUB_STEP_SUMMARY"
            echo "- ⏭️ SBOM skipped" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Workflow:** $WORKFLOW_NAME (#$RUN_NUMBER)" >> "$GITHUB_STEP_SUMMARY"
