name: Docker Image Publish

# Every branch image now builds natively in its own docker-<branch>.yml. What is left
# here is the v* release-tag publisher.
on:
  push:
    tags:
      - 'v*'
    branches:
      - release/3.x
      - release/4.2.x
      - release/4.3.x
      - release/4.4.x
  workflow_dispatch:
    inputs:
      no_cache:
        description: 'Build without layer cache to pull in updated base packages'
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: true

env:
  GHCR_IMAGE_NAME: poweradmin
  DOCKERHUB_IMAGE_NAME: poweradmin/poweradmin

jobs:
  build-push:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      packages: write
      actions: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}

      - name: Lint Dockerfile with hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile

      - name: Set up QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: docker.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # metadata-action derives revision from github.sha, which on a workflow_run
      # event is the default branch rather than the sha actually checked out.
      - name: Resolve build revision
        id: vars
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: |
            ghcr.io/${{ github.repository_owner }}/${{ env.GHCR_IMAGE_NAME }}
            ${{ env.DOCKERHUB_IMAGE_NAME }}
          flavor: |
            latest=false
          labels: |
            org.opencontainers.image.revision=${{ steps.vars.outputs.sha }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ (github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'master') || (github.event_name != 'workflow_run' && github.ref == 'refs/heads/master') }}
            type=raw,value=dev,enable=${{ (github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'develop') || (github.event_name != 'workflow_run' && github.ref == 'refs/heads/develop') }}
            type=raw,value=lts,enable=${{ (github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'release/3.x') || (github.event_name != 'workflow_run' && github.ref == 'refs/heads/release/3.x') }}
            type=raw,value=4.2.x,enable=${{ (github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'release/4.2.x') || (github.event_name != 'workflow_run' && github.ref == 'refs/heads/release/4.2.x') }}
            type=raw,value=4.3.x,enable=${{ (github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'release/4.3.x') || (github.event_name != 'workflow_run' && github.ref == 'refs/heads/release/4.3.x') }}
            type=raw,value=4.4.x,enable=${{ (github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'release/4.4.x') || (github.event_name != 'workflow_run' && github.ref == 'refs/heads/release/4.4.x') }}

      - name: Resolve build cache ref
        id: cache
        env:
          BUILD_REF: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          slug=$(printf '%s' "$BUILD_REF" | tr '/' '-' | tr -cd '[:alnum:]._-')
          owner=$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')
          echo "ref=ghcr.io/${owner}/${GHCR_IMAGE_NAME}:buildcache-${slug}" >> "$GITHUB_OUTPUT"

      - name: Build local image for smoke test
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          tags: poweradmin:smoke-test
          cache-from: |
            type=registry,ref=${{ steps.cache.outputs.ref }}
          no-cache: ${{ github.event_name == 'schedule' || inputs.no_cache == true }}

      # release/3.x runs as 82:82 on port 80 and has no port-switching entrypoint
      - name: Smoke test
        env:
          SKIP_NONROOT: ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'release/3.x') || github.ref == 'refs/heads/release/3.x' }}
        run: |
          args=()
          [ "$SKIP_NONROOT" = "true" ] && args+=(--skip-nonroot)
          ./.github/scripts/docker-smoke.sh poweradmin:smoke-test basic "${args[@]}"

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=registry,ref=${{ steps.cache.outputs.ref }}
          cache-to: type=registry,ref=${{ steps.cache.outputs.ref }},mode=max,ignore-error=true
          no-cache: ${{ github.event_name == 'schedule' || inputs.no_cache == true }}

      - name: Generate SBOM
        if: github.event_name != 'pull_request' && success()
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM as artifact
        if: github.event_name != 'pull_request' && success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ github.run_id }}
          path: sbom.spdx.json

      - name: Job Summary
        if: always()
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_ID: ${{ github.run_id }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          echo "### Docker Build Summary 🐳" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Build Information:**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tags: $IMAGE_TAGS" >> "$GITHUB_STEP_SUMMARY"
          echo "- Platforms: linux/amd64, linux/arm64" >> "$GITHUB_STEP_SUMMARY"
          echo "- Digest: $IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Security & Compliance:**" >> "$GITHUB_STEP_SUMMARY"
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "- ✅ SBOM generated (artifact: sbom-$RUN_ID)" >> "$GITHUB_STEP_SUMMARY"
            echo "- ✅ Images pushed to GHCR and Docker Hub" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- 🔍 Build-only mode (PR)" >> "$GITHUB_STEP_SUMMARY"
            echo "- ⏭️ SBOM skipped" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Workflow:** $WORKFLOW_NAME (#$RUN_NUMBER)" >> "$GITHUB_STEP_SUMMARY"
