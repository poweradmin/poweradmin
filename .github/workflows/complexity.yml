name: complexity report

# Advisory only - never gates a pull request. Scheduled events fire from the
# default branch, so this workflow lives on master but reports on develop, the
# only branch that carries the cognitive-complexity configuration.
on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  complexity:
    name: Cognitive complexity (develop)
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: develop

    - name: Set up PHP and Composer dependencies
      uses: ./.github/actions/php-composer

    - name: Report cognitive complexity
      run: composer analyse:complexity
