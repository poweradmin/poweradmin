name: Docker Minimal Checks

on:
  push:
    branches: [ "release/3.x" ]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
  pull_request:
    branches: [ "release/3.x" ]
    paths:
      - 'Dockerfile'
      - '.dockerignore'

permissions:
  contents: read
  security-events: write

jobs:
  docker-lint:
    name: Dockerfile Linting
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint Dockerfile with hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

  docker-build-test:
    name: Build Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Docker image (test only)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          tags: poweradmin:test-3.x
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: docker-build-test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: poweradmin:scan-3.x

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: poweradmin:scan-3.x
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: 'trivy-results.sarif'

  summary:
    name: Docker Checks Summary
    runs-on: ubuntu-latest
    needs: [docker-lint, docker-build-test, docker-security-scan]
    if: always()

    steps:
      - name: Check job statuses
        run: |
          echo "### Docker Minimal Checks Summary 🐳" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** release/3.x (LTS)" >> $GITHUB_STEP_SUMMARY
          echo "**Scope:** Minimal checks only (no publishing)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.docker-lint.result }}" == "success" ]; then
            echo "- ✅ Dockerfile Linting (hadolint)" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ❌ Dockerfile Linting (hadolint)" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.docker-build-test.result }}" == "success" ]; then
            echo "- ✅ Docker Build Test" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ❌ Docker Build Test" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.docker-security-scan.result }}" == "success" ]; then
            echo "- ✅ Security Scan (Trivy)" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ⚠️ Security Scan (Trivy) - Check results" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Note:** Images are not published from LTS branch." >> $GITHUB_STEP_SUMMARY
          echo "**Note:** Security issues are reported but don't fail the build." >> $GITHUB_STEP_SUMMARY
