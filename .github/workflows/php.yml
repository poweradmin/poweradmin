name: Composer

on:
  push:
    branches: [ "release/3.x" ]
  pull_request:
    branches: [ "release/3.x" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

    - name: Validate composer.json and composer.lock
      run: composer validate --strict --check-lock

    - name: Cache Composer packages
      id: composer-cache
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: vendor
        key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php-

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress

    - name: Fix vendor binary permissions
      run: chmod +x vendor/bin/*

    - name: Check code
      run: composer check:all

    - name: Analyse code
      run: composer analyse:all

    - name: Psalm analysis
      run: composer check:psalm

    - name: Run test suite
      run: composer tests

  compatibility:
    name: PHP ${{ matrix.php-version }} Compatibility
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.1', '8.2', '8.3', '8.4']

    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

    - name: Setup PHP ${{ matrix.php-version }}
      uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
      with:
        php-version: ${{ matrix.php-version }}
        coverage: none

    - name: Get Composer cache directory
      id: composer-cache-dir
      run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

    - name: Cache Composer dependencies
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
      with:
        path: ${{ steps.composer-cache-dir.outputs.dir }}
        key: ${{ runner.os }}-php-${{ matrix.php-version }}-composer-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php-${{ matrix.php-version }}-composer-

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress

    - name: Fix vendor binary permissions
      run: chmod +x vendor/bin/*

    - name: Validate PHP syntax
      run: find . -name "*.php" -not -path "./vendor/*" -print0 | xargs -0 -n1 php -l > /dev/null

    - name: Run basic test suite
      run: composer tests

    - name: Compatibility Summary
      if: always()
      run: |
        echo "### PHP ${{ matrix.php-version }} Compatibility Check ✓" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Target PHP Version:** ${{ matrix.php-version }}" >> $GITHUB_STEP_SUMMARY
        echo "**Checks Performed:**" >> $GITHUB_STEP_SUMMARY
        echo "- PHP syntax validation (all .php files)" >> $GITHUB_STEP_SUMMARY
        echo "- Dependency installation" >> $GITHUB_STEP_SUMMARY
        echo "- Unit test suite execution" >> $GITHUB_STEP_SUMMARY
        echo "**Branch:** release/3.x (LTS)" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Compatibility check completed for PHP ${{ matrix.php-version }}" >> $GITHUB_STEP_SUMMARY

  locale-check:
    name: Locale Empty Translation Check
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

    - name: Install gettext
      run: sudo apt-get install -y gettext

    - name: Check for empty translations in .po files
      run: |
        errors=0
        for f in locale/*/LC_MESSAGES/*.po; do
          [ -f "$f" ] || continue
          stats=$(msgfmt --statistics -o /dev/null "$f" 2>&1)
          if echo "$stats" | grep -q "untranslated"; then
            echo "ERROR: $f has $stats"
            errors=$((errors + 1))
          fi
        done
        if [ "$errors" -gt 0 ]; then
          echo ""
          echo "Found $errors locale file(s) with empty translations."
          exit 1
        fi
        echo "All locale files have complete translations."

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

    - name: Setup PHP
      uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
      with:
        php-version: '8.1'

    # --locked audits composer.lock directly, so nothing is installed here.
    - name: Security audit
      run: composer audit --locked

  vendor-check:
    name: Vendor Integrity
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

    - name: Setup PHP
      uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
      with:
        php-version: '8.1'

    # vendor/ is tracked in the repo as a no-dev, optimized tree. The optimized
    # classmap also covers lib/, so adding a class there without regenerating
    # leaves it stale.
    - name: Verify vendor matches composer.lock and lib/
      run: |
        composer install --no-dev --prefer-dist --no-progress --no-scripts
        composer dump-autoload --optimize
        git checkout -- vendor/composer/installed.php
        if ! git diff --quiet vendor/; then
          git diff --stat vendor/
          echo "::error::vendor/ is out of date. Run: composer install --no-dev --prefer-dist && composer dump-autoload --optimize --no-dev"
          exit 1
        fi

  pin-check:
    name: Digest Pin Check
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

    # Dependabot refreshes existing digest pins but never creates them, so an
    # unpinned image or action would otherwise float unnoticed.
    - name: Require digest-pinned base images and actions
      run: |
        fail=0
        if grep -nE '^[[:space:]]*FROM' Dockerfile | grep -v '@sha256:'; then
          echo "::error file=Dockerfile::FROM must be digest-pinned as image:tag@sha256:..."
          fail=1
        fi
        if grep -rnE '^[[:space:]]*-?[[:space:]]*uses:' .github/workflows/ | grep -vE '@[0-9a-f]{40}'; then
          echo "::error::Actions must be pinned to a full 40-character commit SHA"
          fail=1
        fi
        exit $fail
