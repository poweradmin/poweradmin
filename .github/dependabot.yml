# Dependabot reads this file only from the default branch (master); every other
# branch is driven from here via target-branch.
#
# Note: security updates are only ever raised against master. The weekly
# dependency-audit workflow covers the other branches.
version: 2
updates:

  # ---- master ----
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "09:00"
      timezone: "Europe/Vilnius"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    groups:
      composer:
        patterns: ["*"]
    ignore:
      - dependency-name: "phpunit/phpunit"
        versions: [">=12.0"]
      - dependency-name: "symfony/*"
        versions: [">=8.0"]
      - dependency-name: "tomasvotruba/cognitive-complexity"
        versions: [">=1.2"]
      # master ships the 4.4.x patch line, so it takes patch updates only -
      # matching the release branches. Lift this when a feature release lands.
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "09:00"
      timezone: "Europe/Vilnius"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "09:00"
      timezone: "Europe/Vilnius"
    cooldown:
      default-days: 3
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "09:00"
      timezone: "Europe/Vilnius"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm:
        patterns: ["*"]

  # ---- develop ----
  - package-ecosystem: "composer"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "09:00"
